<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo da imagem de compartilhamento (1200 × 630)</title>
<!-- Capturado por gerar-imagens.mjs. Mesmos tokens da página: docs/spec.md, seção 7. -->
<style>
@font-face { font-family: "Big Shoulders Display"; font-weight: 600 900; src: url("../../fonts/big-shoulders-display.woff2") format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 400 600; src: url("../../fonts/instrument-sans.woff2") format("woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #14171D; color: #ECE6DA; font-family: "Instrument Sans", sans-serif; }
.foto { position: absolute; right: 0; top: 0; width: 660px; height: 630px; }
.foto::before { content: ""; position: absolute; inset: -20% -15% -25% -40%; background: radial-gradient(ellipse at 58% 52%, rgba(227, 154, 58, 0.5) 0%, rgba(227, 154, 58, 0.22) 38%, rgba(227, 154, 58, 0) 70%); filter: blur(28px); }
.foto img { position: relative; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34%); mask-image: linear-gradient(to right, transparent 0, #000 34%); }
.texto { position: absolute; left: 64px; top: 0; height: 630px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
.sobretitulo { margin: 0; font-family: "Big Shoulders Display"; font-weight: 600; font-size: 27px; letter-spacing: 0.12em; text-transform: uppercase; color: #E39A3A; }
.nome { margin: 18px 0 28px; font-family: "Big Shoulders Display"; font-weight: 900; font-size: 138px; line-height: 0.88; text-transform: uppercase; letter-spacing: -0.005em; }
.nome span { display: block; width: max-content; padding-bottom: 0.04em; background-image: linear-gradient(180deg, #F7F8F9 0%, #DDE0E3 34%, #A3A9AF 58%, #C9CDD1 78%, #E39A3A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.16)) drop-shadow(0 3px 3px rgba(0, 0, 0, 0.6)); }
.frase { margin: 0; font-size: 29px; line-height: 1.35; max-width: 540px; }
</style>
</head>
<body>
<div class="foto"><img src="../../img/edu-40-1200.webp" alt=""></div>
<div class="texto">
  <p class="sobretitulo">Gaitista de rock · Brasília, DF</p>
  <h1 class="nome"><span>Eduardo</span><span>Leopoldino</span></h1>
  <p class="frase">Aulas online, gravações a distância, shows e eventos particulares.</p>
</div>
</body>
</html>
